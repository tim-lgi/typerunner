[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typerunner"
version = "1.1.3"
description = "A terminal typing race game: outrun the pacers, clear the hurdles."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Teetzel" }]
keywords = ["typing", "game", "terminal", "curses", "wpm", "race"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
typerunner = "typerunner.game:main"

[tool.hatch.build.targets.wheel]
packages = ["src/typerunner"]

[tool.hatch.build.targets.wheel.force-include]
"src/typerunner/words.txt" = "typerunner/words.txt"

[tool.hatch.build.targets.sdist]
include = ["src/typerunner", "README.md", "LICENSE"]
